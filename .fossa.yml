version: 3

project:
  id: mocklocation
  name: MockLocation

targets:
  only:
    - type: gradle
      path: .

paths:
  exclude:
    - build/
    - .gradle/
    - app/build/
    - "**/*.apk"
    - "**/*.jar"

# Gradle 特定配置
gradle:
  # 禁用 configuration cache 以兼容 FOSSA CLI
  gradle-options: "--no-configuration-cache"