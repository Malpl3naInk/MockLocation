name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:  # 添加手动触发
    inputs:
      version_suffix:
        description: 'Version suffix'
        required: false
        default: 'beta'
        type: choice
        options:
          - alpha
          - beta

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整的 git 历史，用于 gitCommitCount

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Cache Gradle Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/build-cache-*
          key: ${{ runner.os }}-gradle-build-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-

      - name: Cache Kotlin Compiler
        uses: actions/cache@v4
        with:
          path: |
            ~/.kotlin
          key: ${{ runner.os }}-kotlin-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate open source license
        run: ./gradlew licenseReleaseReport --no-configuration-cache

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ./gradlew assembleRelease -PACTION -PVERSION_SUFFIX=${{ inputs.version_suffix }} --build-cache --parallel --daemon --no-watch-fs
          else
            ./gradlew assembleRelease -PACTION -PVERSION_SUFFIX=alpha --build-cache --parallel --daemon --no-watch-fs
          fi

      - name: Install MinIO client
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o mc
          chmod +x mc
          sudo mv mc /usr/local/bin/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 56393 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create Tunnel
        run: |
          ssh -p 56393 -f -N \
              -L 9000:127.0.0.1:9000 \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}

      - name: Configure MinIO client
        run: |
          mc alias set myminio http://127.0.0.1:9000 \
            ${{ secrets.MINIO_ACCESS_KEY }} \
            ${{ secrets.MINIO_SECRET_KEY }}

      - name: Upload artifact
        run: |
          mc cp ./app/build/outputs/apk/release/*.apk myminio/mocklocation-artifacts/

      # - name: Upload APK
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app-release-${{ github.event_name == 'workflow_dispatch' && inputs.version_suffix || 'alpha' }}
      #     path: app/build/outputs/apk/release/*.apk
      #     retention-days: 3