name: FOSSA Scan

on:
  # 在 Android CI 工作流完成后自动触发
  workflow_run:
    workflows: ["Android CI"]
    types:
      - completed
    branches: [main, master]
  
  # 保留手动触发选项
  workflow_dispatch:

jobs:
  fossa:
    runs-on: ubuntu-latest
    # 只在前置工作流成功时执行（如果是 workflow_run 触发）
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整 Git 历史以便 FOSSA 分析

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle  # 添加 Gradle 缓存

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Cache Gradle Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/build-cache-*
          key: ${{ runner.os }}-gradle-build-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Resolve dependencies for FOSSA analysis
        # 下载并解析所有依赖，但不执行完整构建，节省时间
        run: ./gradlew :app:dependencies --build-cache --daemon

      - name: Install FOSSA CLI
        run: |
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | sudo bash
          echo "$HOME/.fossa/bin" >> $GITHUB_PATH

      - name: Verify FOSSA CLI
        run: fossa --version

      - name: Run FOSSA Analyze (Gradle)
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          fossa analyze \
            --debug \
            --branch ${{ github.ref_name }}

      - name: Run FOSSA Test (optional, policy check)
        # 在 PR 触发的构建完成后运行，或手动触发时跳过
        if: github.event.workflow_run.event == 'pull_request'
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          fossa test
        continue-on-error: true  # 不阻止 PR，仅作为警告