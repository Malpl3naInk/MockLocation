name: Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 2.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # 获取完整的 git 历史，用于 gitCommitCount

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate open source license
        run: ./gradlew licenseReleaseReport --no-daemon --parallel --no-configuration-cache

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # 手动触发 release 构建: 纯净无后缀版本 (-PVERSION_SUFFIX= -PVERSION_NAME=x.x.x)
          # 对应 build.gradle.kts 中 isDispatch=true 分支 (无 -PACTION)
        run: |
          ./gradlew assembleRelease \
            -x lint -x test \
            --parallel \
            --build-cache \
            --no-daemon \
            --configuration-cache \
            -PVERSION_NAME=${{ github.event.inputs.version_name }} \
            -PVERSION_SUFFIX=

      - name: Install MinIO client
        run: |
          wget -O mc https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z
          chmod +x mc
          sudo mv mc /usr/local/bin/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 56393 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create Tunnel
        run: |
          ssh -p 56393 -f -N \
              -L 9000:127.0.0.1:9000 \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}

      - name: Configure MinIO client
        run: |
          mc alias set myminio http://127.0.0.1:9000 \
            ${{ secrets.MINIO_ACCESS_KEY }} \
            ${{ secrets.MINIO_SECRET_KEY }}

      - name: Upload artifact
        run: |
          mc cp ./app/build/outputs/apk/release/*.apk myminio/workflow-artifacts/
