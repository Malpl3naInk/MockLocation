stages:
  - build

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.configuration-cache=false"
  GRADLE_BUILD_CACHE: "$CI_PROJECT_DIR/.gradle/build-cache"

# 缓存 Gradle 依赖和构建缓存
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .gradle/wrapper
    - .gradle/caches
    - .gradle/build-cache-*

# 构建 Release APK (alpha 版本)
build:alpha:
  stage: build
  image: openjdk:17-jdk
  before_script:
    # 安装 Android SDK
    - apt-get update -qq && apt-get install -y -qq wget unzip
    - mkdir -p /opt/android-sdk
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
    - unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/
    - mkdir -p /opt/android-sdk/cmdline-tools/latest
    - mv /opt/android-sdk/cmdline-tools/bin /opt/android-sdk/cmdline-tools/lib /opt/android-sdk/cmdline-tools/NOTICE.txt /opt/android-sdk/cmdline-tools/latest/ 2>/dev/null || true
    - mv /opt/android-sdk/cmdline-tools/* /opt/android-sdk/cmdline-tools/latest/ 2>/dev/null || true
    - export ANDROID_HOME=/opt/android-sdk
    - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
    # 接受许可证并安装平台
    - yes | sdkmanager --licenses >/dev/null 2>&1 || true
    - sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1
    # 创建 local.properties
    - echo "sdk.dir=$ANDROID_HOME" > local.properties
    # 解码密钥库
    - echo "$KEYSTORE_FILE_BASE64" | base64 -d > keystore.jks 2>/dev/null || true
    # 授权 gradlew
    - chmod +x ./gradlew
  script:
    # 生成开源许可证报告
    - ./gradlew licenseReleaseReport --no-configuration-cache || true
    # 构建 Release APK (alpha 版本)
    - ./gradlew assembleRelease -PACTION -PVERSION_SUFFIX=alpha
  artifacts:
    name: "app-alpha-${CI_COMMIT_SHORT_SHA}"
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 3 days  # 3天后自动删除旧 artifacts
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
  tags:
    - docker
